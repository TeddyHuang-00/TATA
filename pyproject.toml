[project]
name = "tata"
version = "0.1.0"
description = "TATA stands for TATA-Assisted Teaching Assistant. Helper for human TAs to grade and provide feedback on student assignments. It uses LLMs to analyze student work and generate feedback, and it can also detect potential plagiarism."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "copydetect>=0.5.0",
    "instructor>=1.15.1",
    "markitdown[all]>=0.1.5",
    "nbformat>=5.10.4",
    "nbconvert>=7.16.0",
    "openai>=2.30.0",
    "pydantic-settings>=2.13.1",
    "rich>=14.3.3",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "tqdm>=4.67.3",
    "jupyter>=1.1.1",
    "pydantic>=2.12.5",
]
